<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDTU Messenger</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #000;
            --text-color: #ccc;
            --accent-color: #00ff00;
            --header-bg: #2a2a2a;
            --input-bg: #222;
            --border-color: #333;
            --error-color: #ff4444;
            --success-color: #44ff44;
        }

        body.theme-purple { --bg-color: #12001a; --panel-bg: #08000c; --text-color: #c48eff; --accent-color: #9d00ff; --header-bg: #1f002b; --input-bg: #16001f; --border-color: #58008c; }
        body.theme-blue { --bg-color: #051020; --panel-bg: #000510; --text-color: #b0e0ff; --accent-color: #0088ff; --header-bg: #001a36; --input-bg: #001225; --border-color: #003360; }
        body.theme-red { --bg-color: #1a0505; --panel-bg: #0a0000; --text-color: #ffb0b0; --accent-color: #ff0000; --header-bg: #360000; --input-bg: #250000; --border-color: #600000; }

        @keyframes rainbow-anim {
            0% { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
            14% { color: #ff7f00; text-shadow: 0 0 5px #ff7f00; }
            28% { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
            42% { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
            57% { color: #0000ff; text-shadow: 0 0 5px #0000ff; }
            71% { color: #4b0082; text-shadow: 0 0 5px #4b0082; }
            85% { color: #9400d3; text-shadow: 0 0 5px #9400d3; }
            100% { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
        }
        .rainbow-text { animation: rainbow-anim 3s linear infinite; font-weight: bold; }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: var(--bg-color); 
            color: var(--text-color);
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box; 
            transition: background 0.5s, color 0.5s;
        }

        #login-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: var(--bg-color); 
            z-index: 1000;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 20px;
        }

        .login-form {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            min-width: 350px;
            box-shadow: 0 0 20px rgba(0,255,0,0.1);
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: inherit;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95em;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: var(--accent-color);
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1em;
            transition: opacity 0.3s;
        }

        .login-form button:hover {
            opacity: 0.8;
        }

        .login-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.9em;
            text-align: center;
            margin: 10px 0;
            display: none;
            padding: 8px;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 4px;
        }
        
        header {
            display: flex; 
            gap: 10px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px; 
            flex-wrap: wrap; 
            align-items: center;
        }

        .setting-group { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            background: var(--header-bg); 
            padding: 5px 10px; 
            border-radius: 4px; 
        }
        
        label { 
            font-size: 0.8em; 
            color: var(--text-color); 
            opacity: 0.7; 
        }
        
        input[type="text"].settings-input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            border-bottom: 1px solid #555; 
            width: 100px; 
            font-family: inherit; 
        }
        
        #chatTitle { 
            flex: 2; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.2em; 
            color: var(--accent-color); 
            text-shadow: 0 0 5px rgba(0,0,0,0.5); 
        }
        
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            border: 1px solid var(--border-color); 
            padding: 10px; 
            margin-bottom: 10px; 
            background: var(--panel-bg); 
            font-size: 0.9em; 
        }

        .message { 
            margin-bottom: 5px; 
            display: flex; 
            justify-content: space-between; 
        }
        
        .message-content { 
            flex: 1; 
            white-space: pre-wrap; 
            word-break: break-word; 
        }
        
        .system { 
            color: #777; 
            font-style: italic; 
            font-size: 0.85em; 
        }
        
        .dm-msg { 
            color: #ff00ff; 
            border-left: 2px solid #ff00ff; 
            padding-left: 5px; 
        }
        
        .timestamp { 
            color: #666; 
            font-size: 0.75em; 
            margin-left: 10px; 
            white-space: nowrap; 
        }

        #input-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .image-upload-btn {
            background: var(--input-bg);
            border: 1px dashed var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .image-upload-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(0, 255, 0, 0.1);
        }

        #imageInput {
            display: none;
        }

        #uploadStatus {
            color: #888;
            font-size: 0.8em;
        }

        input#messageInput {
            flex: 1; 
            padding: 12px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: #fff; 
            font-family: inherit; 
            border-radius: 4px;
        }
        
        input#messageInput:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        button { 
            padding: 10px 20px; 
            background: var(--accent-color); 
            color: #000; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
        }

        .db-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 0.8em; 
            background: var(--panel-bg);
        }
        
        .db-table th, .db-table td { 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            text-align: left; 
        }
        
        .db-table th { 
            background: var(--header-bg); 
            color: var(--accent-color);
            font-weight: bold;
        }

        .db-table td {
            color: var(--text-color);
        }

        .db-container {
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .link-text {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
        }

        .link-text:hover {
            text-decoration: underline;
        }

        /* Database Modal */
        #dbModal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            overflow: auto;
        }

        .db-modal-content {
            background-color: var(--panel-bg);
            margin: 5% auto;
            padding: 20px;
            border: 2px solid var(--border-color);
            width: 90%;
            max-width: 1200px;
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .db-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .db-modal-header h2 {
            margin: 0;
            color: var(--accent-color);
        }

        .close-modal {
            color: var(--text-color);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 28px;
        }

        .close-modal:hover {
            color: var(--accent-color);
        }

        #context-menu {
            display: none;
            position: fixed;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 1001;
        }

        #context-menu div {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9em;
        }

        #context-menu div:hover {
            background: var(--accent-color);
            color: #000;
        }

        #copy-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: #000;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1002;
        }

        #copy-toast.show {
            opacity: 1;
        }

    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-form">
            <h2> TDTU MESSENGER</h2>
            
            <div style="text-align: center; color: #888; font-size: 0.9em; margin-bottom: 20px;">
                Secure login required
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
                <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                <button id="loginBtn" onclick="attemptLogin()">LOGIN</button>
                <div class="error-msg" id="loginError"></div>
                <div style="text-align: center; margin-top: 15px;">
                    <a class="link-text" onclick="showSignup()">Don't have an account? Sign up</a>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" style="display: none;">
                <input type="text" id="signupUsername" placeholder="Username (max 20 chars)" maxlength="20" required autocomplete="username">
                <input type="password" id="signupPassword" placeholder="Password (min 4 chars)" required autocomplete="new-password">
                <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
                <button id="signupBtn" onclick="attemptSignup()">CREATE ACCOUNT</button>
                <div class="error-msg" id="signupError"></div>
                <div style="text-align: center; margin-top: 15px;">
                    <a class="link-text" onclick="showLogin()">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="setting-group">
            <label>NAME:</label>
            <input type="text" id="usernameInput" class="settings-input" disabled>
        </div>
        <div class="setting-group">
            <label>COLOR:</label>
            <input type="color" id="colorInput" value="#00ff00" disabled>
        </div>
        <div id="chatTitle">Classroom</div>
        <div style="flex:1; text-align: right; font-size: 0.8em;">
            STATUS: <span id="status" style="color: var(--error-color);">Connecting...</span>
        </div>
    </header>

    <div id="chat-container"></div>

    <div id="input-area" style="display: none;">
        <input type="text" id="messageInput" placeholder="Type /? for commands..." autofocus>
        <button id="imageUploadBtn" class="image-upload-btn" onclick="document.getElementById('imageInput').click()" title="Upload image">+</button>
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
        <span id="uploadStatus" aria-live="polite"></span>
        <button onclick="sendMessage()">SEND</button>
    </div>

    <!-- Database Modal -->
    <div id="dbModal">
        <div class="db-modal-content">
            <div class="db-modal-header">
                <h2>Database View</h2>
                <button class="close-modal" onclick="closeDbModal()">&times;</button>
            </div>
            <div id="dbTableContainer"></div>
        </div>
    </div>

    <!-- Context Menu for Copy -->
    <div id="context-menu">
        <div onclick="copyMessageText()">Copy</div>
    </div>

    <!-- Copy Toast Notification -->
    <div id="copy-toast">Copied!</div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host;
        const RESUME_TOKEN_KEY = 'tdtu.resumeToken';
        let ws = null;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('usernameInput');
        const colorInput = document.getElementById('colorInput');
        const statusSpan = document.getElementById('status');
        const chatTitle = document.getElementById('chatTitle');
        const loginOverlay = document.getElementById('login-overlay');
        const inputArea = document.getElementById('input-area');
        const imageInput = document.getElementById('imageInput');
        const uploadStatus = document.getElementById('uploadStatus');

        const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
        const IMAGE_TYPES = new Set(['image/png', 'image/jpeg', 'image/gif', 'image/webp']);
        let isAuthenticated = false;
        let pendingAuthCommand = null;
        let pendingImageTicket = null;
        let pendingImageFile = null;
        let uploadInProgress = false;

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('signupError').style.display = 'none';
            document.getElementById('signupUsername').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupConfirmPassword').value = '';
            document.getElementById('signupUsername').focus();
        }

        function showLogin() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('signupError').style.display = 'none';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginUsername').focus();
        }

        function attemptLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showError('loginError', 'Please fill in all fields');
                return;
            }

            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginError').style.display = 'none';

            const command = `/login ${username} ${password}`;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'message', content: command }));
            } else {
                pendingAuthCommand = command;
                connectWebSocket();
            }
        }

        function attemptSignup() {
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            
            if (!username || !password || !confirmPassword) {
                showError('signupError', 'Please fill in all fields');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('signupError', 'Passwords do not match');
                return;
            }
            
            if (password.length < 4) {
                showError('signupError', 'Password must be at least 4 characters');
                return;
            }

            if (username.length > 20) {
                showError('signupError', 'Username must be 20 characters or less');
                return;
            }

            document.getElementById('signupBtn').disabled = true;
            document.getElementById('signupError').style.display = 'none';

            const command = `/register ${username} ${password}`;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'message', content: command }));
            } else {
                pendingAuthCommand = command;
                connectWebSocket();
            }
        }

        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            
            // Re-enable buttons
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('signupBtn').disabled = false;
        }

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('✅ WebSocket connected');
                statusSpan.textContent = 'Connected';
                statusSpan.style.color = 'var(--success-color)';
                reconnectAttempts = 0;

                if (pendingAuthCommand) {
                    ws.send(JSON.stringify({ type: 'message', content: pendingAuthCommand }));
                    pendingAuthCommand = null;
                } else {
                    const resumeToken = sessionStorage.getItem(RESUME_TOKEN_KEY);
                    if (resumeToken) ws.send(JSON.stringify({ type: 'resume', token: resumeToken, loadHistory: !isAuthenticated }));
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                switch(data.type) {
                    case 'init':
                        usernameInput.value = data.username;
                        colorInput.value = data.color;
                        isAuthenticated = data.authenticated;
                        if (isAuthenticated) {
                            handleAuthSuccess();
                        }
                        break;

                    case 'auth_success':
                        if (typeof data.resumeToken === 'string') sessionStorage.setItem(RESUME_TOKEN_KEY, data.resumeToken);
                        handleAuthSuccess();
                        break;

                    case 'auth_error':
                        if (data.form === 'resume') {
                            sessionStorage.removeItem(RESUME_TOKEN_KEY);
                            isAuthenticated = false;
                            loginOverlay.style.display = 'flex';
                            inputArea.style.display = 'none';
                            colorInput.disabled = true;
                            showError('loginError', data.message);
                        } else {
                            showError(data.form === 'login' ? 'loginError' : 'signupError', data.message);
                        }
                        break;

                    case 'system':
                        addMessage('system', data.content);
                        break;

                    case 'message':
                        renderChatMessage(data);
                        break;

                    case 'history':
                        data.content.forEach(msg => renderChatMessage(msg));
                        addMessage('system', '--- End of History ---');
                        break;

                    case 'theme':
                        applyTheme(data.theme);
                        break;

                    case 'title':
                        chatTitle.textContent = data.title;
                        break;

                    case 'image_upload_ticket':
                        pendingImageTicket = data;
                        uploadSelectedImage();
                        break;

                    case 'image_removed':
                        const image = document.querySelector(`[data-message-id="${data.id}"] .chat-image`);
                        if (image) replaceExpiredImage(image);
                        break;

                    case 'clear_history':
                        chatContainer.innerHTML = '';
                        break;

                    case 'database_view':
                        openDbModal(data.data);
                        break;

                    case 'pong':
                        const latency = Date.now() - data.startTime;
                        addMessage('system', `Pong! Latency: ${latency}ms`);
                        break;

                    case 'dm':
                        const dmMsg = data.from === usernameInput.value 
                            ? `[DM to ${data.to}] ${data.content}`
                            : `[DM from ${data.from}] ${data.content}`;
                        addMessage('dm', dmMsg, null, data.color);
                        break;
                }
            };

            ws.onclose = () => {
                console.log('❌ WebSocket disconnected');
                statusSpan.textContent = 'Disconnected';
                statusSpan.style.color = 'var(--error-color)';
                
                if (isAuthenticated) {
                    addMessage('system', '❌ Connection lost. Reconnecting...');
                    attemptReconnect();
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function handleAuthSuccess() {
            loginOverlay.style.display = 'none';
            inputArea.style.display = 'flex';
            usernameInput.disabled = true;
            colorInput.disabled = false;
            isAuthenticated = true;
            statusSpan.textContent = 'Authenticated';
            statusSpan.style.color = 'var(--success-color)';
            messageInput.focus();
            
            // Re-enable buttons for potential future use
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('signupBtn').disabled = false;
        }

        function attemptReconnect() {
            if (reconnectTimer) return;
            reconnectAttempts++;
            const delay = Math.min(1000 * 2 ** Math.min(reconnectAttempts, 5), 30000);
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWebSocket();
            }, delay);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !isAuthenticated || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            if (text.toLowerCase() === '/cls' || text.toLowerCase() === '/clear') {
                chatContainer.innerHTML = '';
                messageInput.value = '';
                return;
            }
            
            ws.send(JSON.stringify({ type: 'message', content: text }));
            messageInput.value = '';
        }

        function renderChatMessage(data) {
            const time = new Date(data.timestamp).toLocaleTimeString();
            const message = addMessage('user', data.content, data.username, data.color, time, data.id);
            if (data.imageUrl && /^\/uploads\/[0-9a-f-]+\.(png|jpg|gif|webp)$/i.test(data.imageUrl)) {
                const image = document.createElement('img');
                image.className = 'chat-image';
                image.src = data.imageUrl;
                image.alt = data.content || 'Uploaded image';
                image.loading = 'lazy';
                image.onerror = () => replaceExpiredImage(image);
                message.querySelector('.message-content').appendChild(image);
            }
        }

        function replaceExpiredImage(image) {
            const text = document.createElement('span');
            text.textContent = 'Image deleted or expired';
            image.replaceWith(text);
        }

        function addMessage(type, text, username = null, color = null, timestamp = null, id = null) {
            const div = document.createElement('div');
            div.className = `message ${type === 'system' ? 'system' : (type === 'dm' ? 'dm-msg' : 'user-msg')}`;
            if (id !== null && id !== undefined) div.dataset.messageId = id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (username) {
                const nameSpan = document.createElement('span');
                if (color === 'rainbow') {
                    nameSpan.className = 'rainbow-text';
                } else {
                    nameSpan.style.color = color || 'var(--accent-color)';
                }
                nameSpan.style.fontWeight = 'bold';
                nameSpan.textContent = `[${username}] `;
                contentDiv.appendChild(nameSpan);
            }

            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            contentDiv.appendChild(textSpan);
            div.appendChild(contentDiv);

            // Right-click to copy message text
            if (username && text) {
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    currentlyCopiedElement = textSpan;
                    showContextMenu(e.clientX, e.clientY);
                });
            }

            if (timestamp) {
                const timeSpan = document.createElement('span');
                timeSpan.className = 'timestamp';
                timeSpan.textContent = timestamp;
                div.appendChild(timeSpan);
            }

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function applyTheme(theme) {
            document.body.className = theme !== 'default' ? `theme-${theme}` : '';
        }

        function openDbModal(rows) {
            const modal = document.getElementById('dbModal');
            const container = document.getElementById('dbTableContainer');
            let html = '<table class="db-table"><thead><tr><th>ID</th><th>Username</th><th>Content</th><th>Image</th><th>Timestamp</th></tr></thead><tbody>';
            if (rows.length === 0) {
                html += '<tr><td colspan="5" style="text-align: center; padding: 20px;">No messages in database</td></tr>';
            } else {
                rows.forEach(row => {
                    const time = new Date(row.timestamp).toLocaleString();
                    const image = row.image_url ? `Present — /remove ${row.id}` : 'None';
                    html += `<tr>
                        <td>${row.id}</td>
                        <td>${escapeHtml(row.username)}</td>
                        <td>${escapeHtml(row.content)}</td>
                        <td>${image}</td>
                        <td>${time}</td>
                    </tr>`;
                });
            }
            container.innerHTML = html + '</tbody></table>';
            modal.style.display = 'block';
        }

        function closeDbModal() {
            document.getElementById('dbModal').style.display = 'none';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('dbModal');
            if (event.target === modal) {
                closeDbModal();
            }
        }

        // --- Copy-to-Clipboard ---
        let currentlyCopiedElement = null;

        function showContextMenu(x, y) {
            const menu = document.getElementById('context-menu');
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.style.display = 'block';
            setTimeout(() => document.addEventListener('click', hideContextMenu), 0);
        }

        function hideContextMenu() {
            document.getElementById('context-menu').style.display = 'none';
            document.removeEventListener('click', hideContextMenu);
        }

        function showCopyToast() {
            const toast = document.getElementById('copy-toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyMessageText() {
            hideContextMenu();
            if (currentlyCopiedElement && currentlyCopiedElement.textContent) {
                navigator.clipboard.writeText(currentlyCopiedElement.textContent).then(() => {
                    showCopyToast();
                }).catch(err => {
                    console.error('Failed to copy:', err);
                });
            }
        }

        function beginImageUpload(file) {
            if (!file || uploadInProgress) return;
            if (!IMAGE_TYPES.has(file.type) || file.size > MAX_IMAGE_BYTES) {
                uploadStatus.textContent = 'Use PNG, JPEG, GIF, or WebP up to 5 MiB.';
                imageInput.value = '';
                return;
            }
            if (!isAuthenticated || !ws || ws.readyState !== WebSocket.OPEN) {
                uploadStatus.textContent = 'Connect and login before uploading.';
                return;
            }
            pendingImageFile = file;
            uploadInProgress = true;
            imageInput.disabled = true;
            uploadStatus.textContent = 'Preparing upload...';
            ws.send(JSON.stringify({ type: 'image_upload_ticket' }));
        }

        imageInput.addEventListener('change', () => beginImageUpload(imageInput.files[0]));

        messageInput.addEventListener('paste', event => {
            const file = [...event.clipboardData.items]
                .find(item => item.kind === 'file' && IMAGE_TYPES.has(item.type))
                ?.getAsFile();
            if (!file) return;
            event.preventDefault();
            beginImageUpload(file);
        });

        async function uploadSelectedImage() {
            const file = pendingImageFile;
            const ticket = pendingImageTicket;
            pendingImageTicket = null;
            if (!file || !ticket) return finishImageUpload('Image upload failed.');
            try {
                uploadStatus.textContent = 'Uploading image...';
                const response = await fetch('/api/uploads/images', {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${ticket.ticket}`,
                        'Content-Type': file.type
                    },
                    body: file
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Image upload failed.');
                ws.send(JSON.stringify({ type: 'image_message', imageUrl: data.imageUrl, content: messageInput.value.trim() }));
                messageInput.value = '';
                finishImageUpload('Image sent.');
            } catch (error) {
                finishImageUpload(error.message);
            }
        }

        function finishImageUpload(message) {
            uploadInProgress = false;
            pendingImageFile = null;
            imageInput.disabled = false;
            imageInput.value = '';
            uploadStatus.textContent = message;
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !uploadInProgress) sendMessage();
        });

        colorInput.addEventListener('change', () => {
            if (ws && isAuthenticated && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'update_color', content: colorInput.value }));
            }
        });

        // Support Enter key for login/signup
        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });

        document.getElementById('signupConfirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptSignup();
        });

        // Initialize connection
        connectWebSocket();
    </script>
</body>
</html>
