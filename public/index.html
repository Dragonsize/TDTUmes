<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDTU Messenger</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #000;
            --text-color: #ccc;
            --accent-color: #00ff00;
            --header-bg: #2a2a2a;
            --input-bg: #222;
            --border-color: #333;
            --error-color: #ff4444;
            --success-color: #44ff44;
        }

        body.theme-purple { --bg-color: #12001a; --panel-bg: #08000c; --text-color: #c48eff; --accent-color: #9d00ff; --header-bg: #1f002b; --input-bg: #16001f; --border-color: #58008c; }
        body.theme-blue { --bg-color: #051020; --panel-bg: #000510; --text-color: #b0e0ff; --accent-color: #0088ff; --header-bg: #001a36; --input-bg: #001225; --border-color: #003360; }
        body.theme-red { --bg-color: #1a0505; --panel-bg: #0a0000; --text-color: #ffb0b0; --accent-color: #ff0000; --header-bg: #360000; --input-bg: #250000; --border-color: #600000; }

        @keyframes rainbow-anim {
            0% { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
            14% { color: #ff7f00; text-shadow: 0 0 5px #ff7f00; }
            28% { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
            42% { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
            57% { color: #0000ff; text-shadow: 0 0 5px #0000ff; }
            71% { color: #4b0082; text-shadow: 0 0 5px #4b0082; }
            85% { color: #9400d3; text-shadow: 0 0 5px #9400d3; }
            100% { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
        }
        .rainbow-text { animation: rainbow-anim 3s linear infinite; font-weight: bold; }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: var(--bg-color); 
            color: var(--text-color);
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box; 
            transition: background 0.5s, color 0.5s;
        }

        #login-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: var(--bg-color); 
            z-index: 1000;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 20px;
        }

        .login-form {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            min-width: 350px;
            box-shadow: 0 0 20px rgba(0,255,0,0.1);
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: inherit;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95em;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: var(--accent-color);
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1em;
            transition: opacity 0.3s;
        }

        .login-form button:hover {
            opacity: 0.8;
        }

        .login-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.9em;
            text-align: center;
            margin: 10px 0;
            display: none;
            padding: 8px;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 4px;
        }
        
        header {
            display: flex; 
            gap: 10px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px; 
            flex-wrap: wrap; 
            align-items: center;
        }

        .setting-group { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            background: var(--header-bg); 
            padding: 5px 10px; 
            border-radius: 4px; 
        }
        
        label { 
            font-size: 0.8em; 
            color: var(--text-color); 
            opacity: 0.7; 
        }
        
        input[type="text"].settings-input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            border-bottom: 1px solid #555; 
            width: 100px; 
            font-family: inherit; 
        }
        
        #chatTitle { 
            flex: 2; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.2em; 
            color: var(--accent-color); 
            text-shadow: 0 0 5px rgba(0,0,0,0.5); 
        }
        
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            border: 1px solid var(--border-color); 
            padding: 10px; 
            margin-bottom: 10px; 
            background: var(--panel-bg); 
            font-size: 0.9em; 
        }

        .message { 
            margin-bottom: 5px; 
            display: flex; 
            justify-content: space-between; 
        }
        
        .message-content { 
            flex: 1; 
            white-space: pre-wrap; 
            word-break: break-word; 
        }
        
        .system { 
            color: #777; 
            font-style: italic; 
            font-size: 0.85em; 
        }
        
        .dm-msg { 
            color: #ff00ff; 
            border-left: 2px solid #ff00ff; 
            padding-left: 5px; 
        }
        
        .timestamp { 
            color: #666; 
            font-size: 0.75em; 
            margin-left: 10px; 
            white-space: nowrap; 
        }

        #input-area { 
            display: flex; 
            gap: 10px; 
        }
        
        input#messageInput { 
            flex: 1; 
            padding: 12px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: #fff; 
            font-family: inherit; 
            border-radius: 4px;
        }
        
        input#messageInput:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        button { 
            padding: 10px 20px; 
            background: var(--accent-color); 
            color: #000; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
        }

        .db-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 0.8em; 
            background: var(--panel-bg);
        }
        
        .db-table th, .db-table td { 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            text-align: left; 
        }
        
        .db-table th { 
            background: var(--header-bg); 
            color: var(--accent-color);
            font-weight: bold;
        }

        .db-table td {
            color: var(--text-color);
        }

        .db-container {
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .link-text {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
        }

        .link-text:hover {
            text-decoration: underline;
        }

        /* Database Modal */
        #dbModal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            overflow: auto;
        }

        .db-modal-content {
            background-color: var(--panel-bg);
            margin: 5% auto;
            padding: 20px;
            border: 2px solid var(--border-color);
            width: 90%;
            max-width: 1200px;
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .db-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .db-modal-header h2 {
            margin: 0;
            color: var(--accent-color);
        }

        .close-modal {
            color: var(--text-color);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 28px;
        }

        .close-modal:hover {
            color: var(--accent-color);
        }

        /* Tabs */
        #tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9em;
        }
        .tab-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .tab-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        #panels-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .tab-panel.active { display: flex; }

        /* AI Chatbot sub-tabs */
        .ai-sub-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
        .ai-sub-btn { padding: 6px 12px; background: var(--header-bg); border: 1px solid var(--border-color); color: var(--text-color); cursor: pointer; border-radius: 4px; font-size: 0.85em; }
        .ai-sub-btn:hover { border-color: var(--accent-color); }
        .ai-sub-btn.active { background: var(--accent-color); color: #000; }
        .ai-room-view, .ai-bot-view { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
        .ai-room-view.active, .ai-bot-view.active { display: flex; }
        .ai-room-view #input-area { display: flex; }

        /* Marketplace */
        .marketplace-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; overflow-y: auto; flex: 1; padding: 8px 0; }
        .item-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; }
        .item-card h4 { margin: 0 0 6px; color: var(--accent-color); font-size: 0.95em; }
        .item-card .price { color: var(--success-color); font-weight: bold; }
        .item-card .seller { color: #888; font-size: 0.8em; margin-top: 4px; }

        /* Flashcard */
        .flashcard-layout { display: flex; gap: 12px; flex: 1; min-height: 0; overflow: hidden; }
        .deck-list { width: 200px; border-right: 1px solid var(--border-color); padding-right: 10px; overflow-y: auto; }
        .deck-item { padding: 8px; cursor: pointer; border-radius: 4px; margin-bottom: 4px; border: 1px solid transparent; }
        .deck-item:hover, .deck-item.selected { border-color: var(--accent-color); background: var(--header-bg); }
        .deck-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .card-study { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .flashcard { width: 100%; max-width: 400px; min-height: 180px; perspective: 1000px; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; min-height: 180px; transition: transform 0.5s; transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 8px; text-align: center; }
        .flashcard-back { transform: rotateY(180deg); }
        .flashcard-nav { margin-top: 16px; display: flex; gap: 10px; }
        .card-editor { flex: 1; overflow-y: auto; padding: 10px; }
        .card-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; background: var(--header-bg); padding: 8px; border-radius: 4px; }
        .card-row input { flex: 1; padding: 6px; background: var(--input-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; font-size: 0.9em; }
        .card-row button { padding: 4px 10px; font-size: 0.85em; }
        .empty-deck { color: #666; text-align: center; padding: 40px 20px; }

        /* AI Chatbot messages */
        .ai-messages { flex: 1; overflow-y: auto; padding: 10px; }
        .ai-msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; max-width: 85%; }
        .ai-msg.user { margin-left: auto; background: var(--accent-color); color: #000; }
        .ai-msg.bot { margin-right: auto; background: var(--header-bg); border: 1px solid var(--border-color); white-space: pre-wrap; word-break: break-word; }
        .ai-input { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border-color); }
        .ai-input input { flex: 1; padding: 10px; background: var(--input-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; font-family: inherit; }
        .ai-input input:focus { outline: none; border-color: var(--accent-color); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-form">
            <h2> TDTU MESSENGER</h2>
            
            <div style="text-align: center; color: #888; font-size: 0.9em; margin-bottom: 20px;">
                Secure login required
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
                <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:0.9em;cursor:pointer;">
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <button id="loginBtn" onclick="attemptLogin()">LOGIN</button>
                <div class="error-msg" id="loginError"></div>
                <div style="text-align: center; margin-top: 15px;">
                    <a class="link-text" onclick="showSignup()">Don't have an account? Sign up</a>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" style="display: none;">
                <input type="text" id="signupUsername" placeholder="Username (max 20 chars)" maxlength="20" required autocomplete="username">
                <input type="password" id="signupPassword" placeholder="Password (min 4 chars)" required autocomplete="new-password">
                <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
                <button id="signupBtn" onclick="attemptSignup()">CREATE ACCOUNT</button>
                <div class="error-msg" id="signupError"></div>
                <div style="text-align: center; margin-top: 15px;">
                    <a class="link-text" onclick="showLogin()">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="setting-group">
            <label>NAME:</label>
            <input type="text" id="usernameInput" class="settings-input" disabled>
        </div>
        <div class="setting-group">
            <label>COLOR:</label>
            <input type="color" id="colorInput" value="#00ff00" disabled>
        </div>
        <div id="chatTitle">Classroom</div>
        <div style="flex:1; text-align: right; font-size: 0.8em;">
            STATUS: <span id="status" style="color: var(--error-color);">Connecting...</span>
        </div>
    </header>

    <nav id="tab-bar">
        <button class="tab-btn" data-tab="marketplace">Marketplace</button>
        <button class="tab-btn" data-tab="flashcard">Flashcard</button>
        <button class="tab-btn" data-tab="ai">AI Chatbot</button>
    </nav>

    <div id="panels-wrapper">
        <!-- Marketplace -->
        <div id="marketplace-panel" class="tab-panel">
            <div class="marketplace-grid" id="marketplaceGrid"></div>
        </div>

        <!-- Flashcard -->
        <div id="flashcard-panel" class="tab-panel">
            <div class="flashcard-layout">
                <div class="deck-list">
                    <div class="deck-actions">
                        <input type="text" id="newDeckName" placeholder="New deck name" style="flex:1;min-width:100px;padding:6px;background:var(--input-bg);border:1px solid var(--border-color);color:#fff;border-radius:4px;">
                        <button onclick="addDeck()">Add</button>
                    </div>
                    <div id="deckList"></div>
                </div>
                <div class="card-editor" id="cardEditor">
                    <div class="empty-deck" id="emptyDeck">Select or create a deck</div>
                    <div id="addCardForm" style="display:none;">
                        <div class="card-row">
                            <input id="cardFrontInput" placeholder="Front">
                            <input id="cardBackInput" placeholder="Back">
                            <button onclick="addCard()">Add card</button>
                        </div>
                        <button onclick="startStudy()" style="margin-bottom:10px;">Study</button>
                    </div>
                    <div id="cardList" style="display:none;"></div>
                    <div id="studyView" style="display:none;">
                        <div class="card-study">
                            <div class="flashcard" id="flashcard" onclick="flipCard()">
                                <div class="flashcard-inner">
                                    <div class="flashcard-front" id="studyFront"></div>
                                    <div class="flashcard-back" id="studyBack"></div>
                                </div>
                            </div>
                            <div class="flashcard-nav">
                                <button onclick="prevCard()">Prev</button>
                                <span id="cardCounter">0/0</span>
                                <button onclick="nextCard()">Next</button>
                                <button onclick="exitStudy()">Exit</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Chatbot (Room + AI) -->
        <div id="ai-chatbot-panel" class="tab-panel">
            <div class="ai-sub-tabs">
                <button class="ai-sub-btn active" data-sub="room">Room</button>
                <button class="ai-sub-btn" data-sub="bot">AI</button>
            </div>
            <div class="ai-room-view active">
                <div id="chat-container"></div>
                <div id="input-area">
                    <input type="text" id="messageInput" placeholder="Type /? for commands..." autofocus>
                    <button onclick="sendMessage()">SEND</button>
                </div>
            </div>
            <div class="ai-bot-view">
                <div class="ai-messages" id="aiMessages"></div>
                <div class="ai-input">
                    <input type="text" id="aiMessageInput" placeholder="Ask tdtuAI..." autocomplete="off">
                    <button onclick="sendAiMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Database Modal -->
    <div id="dbModal">
        <div class="db-modal-content">
            <div class="db-modal-header">
                <h2>Database View</h2>
                <button class="close-modal" onclick="closeDbModal()">&times;</button>
            </div>
            <div id="dbTableContainer"></div>
        </div>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host;
        let ws = null;
        let reconnectAttempts = 0;
        let maxReconnectAttempts = 5;
        
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('usernameInput');
        const colorInput = document.getElementById('colorInput');
        const statusSpan = document.getElementById('status');
        const chatTitle = document.getElementById('chatTitle');
        const loginOverlay = document.getElementById('login-overlay');
        const inputArea = document.getElementById('input-area');

        let isAdmin = false;
        let isAuthenticated = false;
        let pendingAuthCommand = null;

        // --- Cookies ---
        function setCookie(name, value, days) {
            let s = name + '=' + encodeURIComponent(value);
            if (days) { var d = new Date(); d.setTime(d.getTime() + days * 86400000); s += '; expires=' + d.toUTCString(); }
            s += '; path=/';
            document.cookie = s;
        }
        function getCookie(name) {
            const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? decodeURIComponent(m[2]) : '';
        }

        // --- Tabs ---
        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === (id === 'ai' ? 'ai-chatbot-panel' : id + '-panel')));
            setCookie('lastTab', id, 30);
            if (id === 'marketplace') renderMarketplace();
            if (id === 'flashcard') renderDeckList();
            if (id === 'ai') switchAiSub(getCookie('aiSubTab') || 'room');
        }
        function switchAiSub(sub) {
            document.querySelectorAll('.ai-sub-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === sub));
            document.querySelector('.ai-room-view').classList.toggle('active', sub === 'room');
            document.querySelector('.ai-bot-view').classList.toggle('active', sub === 'bot');
            setCookie('aiSubTab', sub, 30);
            if (sub === 'bot') document.getElementById('aiMessageInput').focus();
        }

        // --- Marketplace ---
        var MOCK_ITEMS = [
            { id: 1, title: 'Calculus I Notes', price: 'Free', seller: 'senior_student' },
            { id: 2, title: 'Programming 101 E-book', price: '5k', seller: 'cs_major' },
            { id: 3, title: 'Physics Lab Report Template', price: 'Free', seller: 'lab_ta' },
            { id: 4, title: 'English Grammar Cheat Sheet', price: '2k', seller: 'english_club' },
            { id: 5, title: 'Old Textbook - OOP', price: '50k', seller: 'graduating' },
            { id: 6, title: 'Past Exam Papers 2023', price: '10k', seller: 'smu' }
        ];
        function renderMarketplace() {
            var el = document.getElementById('marketplaceGrid');
            if (!el) return;
            el.innerHTML = MOCK_ITEMS.map(function (it) {
                return '<div class="item-card"><h4>' + escapeHtml(it.title) + '</h4><div class="price">' + escapeHtml(it.price) + '</div><div class="seller">' + escapeHtml(it.seller) + '</div></div>';
            }).join('');
        }

        // --- Flashcard ---
        var FLASHCARD_KEY = 'tdtumes_decks';
        var selectedDeckId = null;
        var studyIndex = 0;
        var studyDeck = null;

        function getDecks() { try { var d = JSON.parse(localStorage.getItem(FLASHCARD_KEY) || '{"decks":[]}'); return d.decks || []; } catch (e) { return []; } }
        function saveDecks(decks) { localStorage.setItem(FLASHCARD_KEY, JSON.stringify({ decks: decks })); }

        function addDeck() {
            var name = (document.getElementById('newDeckName') || {}).value?.trim();
            if (!name) return;
            var decks = getDecks();
            var id = 'd' + Date.now();
            decks.push({ id: id, name: name, cards: [] });
            saveDecks(decks);
            (document.getElementById('newDeckName') || {}).value = '';
            renderDeckList();
            selectDeck(id);
        }
        function selectDeck(id) {
            selectedDeckId = id;
            studyDeck = null;
            document.getElementById('emptyDeck').style.display = 'none';
            document.getElementById('addCardForm').style.display = 'block';
            document.getElementById('cardList').style.display = 'block';
            document.getElementById('studyView').style.display = 'none';
            document.querySelectorAll('.deck-item').forEach(function (e) { e.classList.toggle('selected', e.dataset.id === id); });
            renderCardList();
        }
        function renderDeckList() {
            var decks = getDecks();
            var el = document.getElementById('deckList');
            if (!el) return;
            el.innerHTML = decks.map(function (d) { return '<div class="deck-item' + (d.id === selectedDeckId ? ' selected' : '') + '" data-id="' + escapeHtml(d.id) + '" onclick="selectDeck(\'' + d.id.replace(/'/g, "\\'") + '\')">' + escapeHtml(d.name) + ' (' + (d.cards ? d.cards.length : 0) + ')</div>'; }).join('');
        }
        function renderCardList() {
            var decks = getDecks();
            var d = decks.find(function (x) { return x.id === selectedDeckId; });
            var el = document.getElementById('cardList');
            if (!el) return;
            if (!d || !d.cards || !d.cards.length) { el.innerHTML = ''; el.style.display = 'none'; return; }
            el.style.display = 'block';
            el.innerHTML = '<div style="margin-bottom:8px;">Cards:</div>' + d.cards.map(function (c, i) {
                return '<div class="card-row"><input value="' + escapeHtml(c.front) + '" readonly><input value="' + escapeHtml(c.back) + '" readonly><button onclick="deleteCard(' + i + ')">Del</button></div>';
            }).join('');
        }
        function addCard() {
            var front = (document.getElementById('cardFrontInput') || {}).value?.trim();
            var back = (document.getElementById('cardBackInput') || {}).value?.trim();
            if (!front && !back) return;
            var decks = getDecks();
            var d = decks.find(function (x) { return x.id === selectedDeckId; });
            if (!d) return;
            if (!d.cards) d.cards = [];
            d.cards.push({ front: front || '(blank)', back: back || '(blank)' });
            saveDecks(decks);
            (document.getElementById('cardFrontInput') || {}).value = '';
            (document.getElementById('cardBackInput') || {}).value = '';
            renderCardList();
            renderDeckList();
        }
        function deleteCard(i) {
            var decks = getDecks();
            var d = decks.find(function (x) { return x.id === selectedDeckId; });
            if (!d || !d.cards || !d.cards[i]) return;
            d.cards.splice(i, 1);
            saveDecks(decks);
            renderCardList();
            renderDeckList();
        }
        function startStudy() {
            var decks = getDecks();
            var d = decks.find(function (x) { return x.id === selectedDeckId; });
            if (!d || !d.cards || !d.cards.length) return;
            studyDeck = d;
            studyIndex = 0;
            document.getElementById('addCardForm').style.display = 'none';
            document.getElementById('cardList').style.display = 'none';
            document.getElementById('studyView').style.display = 'block';
            document.getElementById('flashcard').classList.remove('flipped');
            showStudyCard();
        }
        function showStudyCard() {
            if (!studyDeck || !studyDeck.cards.length) return;
            var c = studyDeck.cards[studyIndex];
            var fc = document.getElementById('studyFront');
            var bc = document.getElementById('studyBack');
            if (fc) fc.textContent = c.front;
            if (bc) bc.textContent = c.back;
            var cc = document.getElementById('cardCounter');
            if (cc) cc.textContent = (studyIndex + 1) + '/' + studyDeck.cards.length;
        }
        function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
        function prevCard() {
            if (!studyDeck || !studyDeck.cards.length) return;
            studyIndex = (studyIndex - 1 + studyDeck.cards.length) % studyDeck.cards.length;
            document.getElementById('flashcard').classList.remove('flipped');
            showStudyCard();
        }
        function nextCard() {
            if (!studyDeck || !studyDeck.cards.length) return;
            studyIndex = (studyIndex + 1) % studyDeck.cards.length;
            document.getElementById('flashcard').classList.remove('flipped');
            showStudyCard();
        }
        function exitStudy() {
            document.getElementById('studyView').style.display = 'none';
            document.getElementById('addCardForm').style.display = 'block';
            renderCardList();
            if (studyDeck) { document.getElementById('cardList').style.display = studyDeck.cards && studyDeck.cards.length ? 'block' : 'none'; }
        }

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('signupError').style.display = 'none';
            document.getElementById('signupUsername').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupConfirmPassword').value = '';
            document.getElementById('signupUsername').focus();
        }

        function showLogin() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('signupError').style.display = 'none';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginUsername').focus();
        }

        function attemptLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showError('loginError', 'Please fill in all fields');
                return;
            }

            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginError').style.display = 'none';

            const command = `/login ${username} ${password}`;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'message', content: command }));
            } else {
                pendingAuthCommand = command;
                connectWebSocket();
            }
        }

        function attemptSignup() {
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            
            if (!username || !password || !confirmPassword) {
                showError('signupError', 'Please fill in all fields');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('signupError', 'Passwords do not match');
                return;
            }
            
            if (password.length < 4) {
                showError('signupError', 'Password must be at least 4 characters');
                return;
            }

            if (username.length > 20) {
                showError('signupError', 'Username must be 20 characters or less');
                return;
            }

            document.getElementById('signupBtn').disabled = true;
            document.getElementById('signupError').style.display = 'none';

            const command = `/register ${username} ${password}`;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'message', content: command }));
            } else {
                pendingAuthCommand = command;
                connectWebSocket();
            }
        }

        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            
            // Re-enable buttons
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('signupBtn').disabled = false;
        }

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('✅ WebSocket connected');
                statusSpan.textContent = 'Connected';
                statusSpan.style.color = 'var(--success-color)';
                reconnectAttempts = 0;

                // Send pending auth command if exists
                if (pendingAuthCommand) {
                    ws.send(JSON.stringify({ type: 'message', content: pendingAuthCommand }));
                    pendingAuthCommand = null;
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                switch(data.type) {
                    case 'init':
                        usernameInput.value = data.username;
                        colorInput.value = data.color;
                        isAuthenticated = data.authenticated;
                        if (isAuthenticated) {
                            handleAuthSuccess();
                        }
                        break;

                    case 'auth_success':
                        handleAuthSuccess();
                        break;

                    case 'auth_error':
                        showError(data.form === 'login' ? 'loginError' : 'signupError', data.message);
                        break;

                    case 'system':
                        addMessage('system', data.content);
                        break;

                    case 'message':
                        renderChatMessage(data);
                        break;

                    case 'history':
                        data.content.forEach(msg => renderChatMessage(msg));
                        addMessage('system', '--- End of History ---');
                        break;

                    case 'theme':
                        applyTheme(data.theme);
                        break;

                    case 'title':
                        chatTitle.textContent = data.title;
                        break;

                    case 'admin_granted':
                        isAdmin = true;
                        break;

                    case 'clear_history':
                        chatContainer.innerHTML = '';
                        break;

                    case 'database_view':
                        openDbModal(data.data);
                        break;

                    case 'pong':
                        const latency = Date.now() - data.startTime;
                        addMessage('system', `Pong! Latency: ${latency}ms`);
                        break;

                    case 'dm':
                        const dmMsg = data.from === usernameInput.value 
                            ? `[DM to ${data.to}] ${data.content}`
                            : `[DM from ${data.from}] ${data.content}`;
                        addMessage('dm', dmMsg, null, data.color);
                        break;
                }
            };

            ws.onclose = () => {
                console.log('❌ WebSocket disconnected');
                statusSpan.textContent = 'Disconnected';
                statusSpan.style.color = 'var(--error-color)';
                
                if (isAuthenticated) {
                    addMessage('system', '❌ Connection lost. Reconnecting...');
                    attemptReconnect();
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function handleAuthSuccess() {
            loginOverlay.style.display = 'none';
            usernameInput.disabled = true;
            colorInput.disabled = false;
            isAuthenticated = true;
            statusSpan.textContent = 'Authenticated';
            statusSpan.style.color = 'var(--success-color)';
            if (document.getElementById('rememberMe')) {
                if (document.getElementById('rememberMe').checked)
                    setCookie('rememberUsername', document.getElementById('loginUsername').value, 365);
                else setCookie('rememberUsername', '', -1);
            }
            var tab = getCookie('lastTab') || 'ai';
            switchTab(tab);
            if (tab === 'ai') { var s = getCookie('aiSubTab') || 'room'; (s === 'room' ? messageInput : document.getElementById('aiMessageInput')).focus(); }
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('signupBtn').disabled = false;
        }

        function attemptReconnect() {
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                setTimeout(() => {
                    console.log(`Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`);
                    connectWebSocket();
                }, 2000 * reconnectAttempts);
            } else {
                addMessage('system', '❌ Failed to reconnect. Please refresh the page.');
            }
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !isAuthenticated || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            if (text.toLowerCase() === '/cls' || text.toLowerCase() === '/clear') {
                chatContainer.innerHTML = '';
                messageInput.value = '';
                return;
            }
            
            ws.send(JSON.stringify({ type: 'message', content: text }));
            messageInput.value = '';
        }

        function renderChatMessage(data) {
            const time = new Date(data.timestamp).toLocaleTimeString();
            addMessage('user', data.content, data.username, data.color, time);
        }

        function addMessage(type, text, username = null, color = null, timestamp = null) {
            const div = document.createElement('div');
            div.className = `message ${type === 'system' ? 'system' : (type === 'dm' ? 'dm-msg' : 'user-msg')}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (username) {
                const nameSpan = document.createElement('span');
                if (color === 'rainbow') {
                    nameSpan.className = 'rainbow-text';
                } else {
                    nameSpan.style.color = color || 'var(--accent-color)';
                }
                nameSpan.style.fontWeight = 'bold';
                nameSpan.textContent = `[${username}] `;
                contentDiv.appendChild(nameSpan);
            }

            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            contentDiv.appendChild(textSpan);
            div.appendChild(contentDiv);

            if (timestamp) {
                const timeSpan = document.createElement('span');
                timeSpan.className = 'timestamp';
                timeSpan.textContent = timestamp;
                div.appendChild(timeSpan);
            }

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function applyTheme(theme) {
            document.body.className = theme !== 'default' ? `theme-${theme}` : '';
        }

        function openDbModal(rows) {
            const modal = document.getElementById('dbModal');
            const container = document.getElementById('dbTableContainer');
            
            let html = '<table class="db-table"><thead><tr><th>ID</th><th>Username</th><th>Content</th><th>Timestamp</th></tr></thead><tbody>';
            
            if (rows.length === 0) {
                html += '<tr><td colspan="4" style="text-align: center; padding: 20px;">No messages in database</td></tr>';
            } else {
                rows.forEach(row => {
                    const time = new Date(row.timestamp).toLocaleString();
                    const content = escapeHtml(row.content);
                    html += `<tr>
                        <td>${row.id}</td>
                        <td>${escapeHtml(row.username)}</td>
                        <td>${content}</td>
                        <td>${time}</td>
                    </tr>`;
                });
            }
            
            html += '</tbody></table>';
            container.innerHTML = html;
            modal.style.display = 'block';
        }

        function closeDbModal() {
            document.getElementById('dbModal').style.display = 'none';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('dbModal');
            if (event.target === modal) {
                closeDbModal();
            }
        }

        messageInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') sendMessage(); 
        });

        colorInput.addEventListener('change', () => {
            if (ws && isAuthenticated && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'update_color', content: colorInput.value }));
            }
        });

        // Support Enter key for login/signup
        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });

        document.getElementById('signupConfirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptSignup();
        });

        document.getElementById('aiMessageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendAiMessage();
        });

        function sendAiMessage() {
            var input = document.getElementById('aiMessageInput');
            var msg = (input && input.value || '').trim();
            if (!msg) return;
            var container = document.getElementById('aiMessages');
            var div = document.createElement('div');
            div.className = 'ai-msg user';
            div.textContent = msg;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            if (input) input.value = '';

            fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var d = document.createElement('div');
                    d.className = 'ai-msg bot';
                    d.textContent = data.reply || 'No response.';
                    container.appendChild(d);
                    container.scrollTop = container.scrollHeight;
                })
                .catch(function() {
                    var d = document.createElement('div');
                    d.className = 'ai-msg bot';
                    d.textContent = 'Request failed. Check connection.';
                    container.appendChild(d);
                    container.scrollTop = container.scrollHeight;
                });
        }

        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() { switchTab(btn.dataset.tab); });
        });
        document.querySelectorAll('.ai-sub-btn').forEach(function(btn) {
            btn.addEventListener('click', function() { switchAiSub(btn.dataset.sub); });
        });

        var ru = getCookie('rememberUsername');
        if (ru) { var lu = document.getElementById('loginUsername'); if (lu) lu.value = ru; }

        // Initialize connection
        connectWebSocket();
    </script>
</body>
</html>
